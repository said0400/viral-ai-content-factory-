[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-ai-content-factory"
version = "2.0.0"
description = "Arabic Cinematic Shorts Generator using AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AI Shorts Generator", email = "your@email.com" }
]
keywords = [
    "ai", "video", "shorts", "arabic", "tts",
    "tiktok", "youtube", "content-generation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "groq>=0.11.0",
    "google-genai>=0.3.0",
    "edge-tts>=6.1.10",
    "faster-whisper>=1.0.3",
    "pydub>=0.25.1",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "requests>=2.32.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.4",
    "colorama>=0.4.6",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
elevenlabs = ["elevenlabs>=1.7.0"]
youtube = ["yt-dlp>=2024.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
]
all = [
    "viral-ai-content-factory[elevenlabs,youtube,dev]",
]

[project.urls]
Homepage = "https://github.com/yourusername/viral-ai-factory"
Repository = "https://github.com/yourusername/viral-ai-factory.git"
Issues = "https://github.com/yourusername/viral-ai-factory/issues"
Documentation = "https://github.com/yourusername/viral-ai-factory#readme"

[project.scripts]
viral-factory = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]
exclude = ["tests*", "remotion*"]

# ═══════════════════════════════════════════════════════════════════
# Tools Configuration
# ═══════════════════════════════════════════════════════════════════

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=engine",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-v",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["engine"]
omit = [
    "tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
