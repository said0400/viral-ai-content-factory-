name: 🎬 Generate Arabic Shorts (Pro Audio Edition v2.3)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "📝 موضوع الفيديو"
        required: false
        default: "الطموح والنجاح"
      
      content_type:
        description: "🎭 نوع المحتوى"
        required: false
        default: "motivational"
        type: choice
        options:
          - motivational
          - educational
          - story
          - quote
      
      # 🎙️ اختيار محرك TTS
      tts_engine:
        description: "🎙️ محرك الصوت"
        required: false
        default: "edge"
        type: choice
        options:
          - edge
          - gemini
          - elevenlabs
      
      voice:
        description: "🎙️ صوت Edge TTS"
        required: false
        default: "ar-SA-HamedNeural"
        type: choice
        options:
          - ar-SA-HamedNeural
          - ar-SA-ZariyahNeural
          - ar-EG-ShakirNeural
          - ar-EG-SalmaNeural
      
      gemini_voice:
        description: "🎤 صوت Gemini"
        required: false
        default: "Achird"
        type: choice
        options:
          - Achird
          - Algenib
          - Aoede
          - Charon
          - Kore
      
      # ⚡ سرعة الصوت
      audio_speed:
        description: "⚡ سرعة الصوت (1.0=طبيعي, 1.1=سريع TikTok)"
        required: false
        default: "1.1"
        type: choice
        options:
          - "1.0"
          - "1.05"
          - "1.1"
          - "1.15"
          - "1.2"
          - "1.25"
      
      # 🔇 إزالة الفراغات
      remove_silence:
        description: "🔇 إزالة الفراغات الطويلة"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      
      # 🆕 الموسيقى الخلفية
      enable_music:
        description: "🎵 تفعيل الموسيقى الخلفية"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      
      music_volume:
        description: "🎵 مستوى الموسيقى"
        required: false
        default: "0.15"
        type: choice
        options:
          - "0.10"
          - "0.15"
          - "0.20"
          - "0.25"
      
      # 🆕 المؤثرات الصوتية SFX
      enable_sfx:
        description: "🔊 تفعيل المؤثرات الصوتية"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      
      sfx_volume:
        description: "🔊 مستوى المؤثرات"
        required: false
        default: "0.35"
        type: choice
        options:
          - "0.25"
          - "0.35"
          - "0.45"
          - "0.50"
      
      duration:
        description: "⏱️ مدة الفيديو (ثانية)"
        required: false
        default: "45"
        type: choice
        options: ["30", "45", "60"]
      
      quality:
        description: "✨ جودة التصدير"
        required: false
        default: "high"
        type: choice
        options: [medium, high, ultra]

permissions:
  contents: write

jobs:
  generate:
    name: 🚀 Generate & Publish Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🎞️ Install FFmpeg & Chromium dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-color-emoji \
            fontconfig \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64 \
            libxss1 \
            libxshmfence1 \
            libglu1-mesa

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 Install Remotion dependencies
        working-directory: ./remotion
        run: |
          if [ -f "package-lock.json" ]; then
            echo "✓ Using npm ci (faster)"
            npm ci
          else
            echo "⚠ No package-lock.json, using npm install"
            npm install
          fi

      - name: ✅ Verify Remotion installation
        working-directory: ./remotion
        run: |
          echo "📦 Node.js version:"
          node --version
          echo ""
          echo "📦 NPM version:"
          npm --version
          echo ""
          echo "📁 Remotion files:"
          ls -la
          echo ""
          echo "📁 node_modules check:"
          if [ -d "node_modules/@remotion" ]; then
            ls node_modules/@remotion/ | head -10
          else
            echo "⚠ No @remotion modules found"
          fi

      - name: 🔤 Download Arabic fonts
        run: python download_fonts.py

      - name: 📁 Create required directories
        run: |
          mkdir -p output temp
          mkdir -p engine/assets/fonts
          mkdir -p engine/assets/music
          mkdir -p engine/assets/sfx
          mkdir -p remotion/public/fonts
          mkdir -p remotion/out

      - name: 🔍 Pre-flight check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          REMOTION_DIR: ./remotion
          TTS_ENGINE: ${{ github.event.inputs.tts_engine }}
          ENABLE_BACKGROUND_MUSIC: ${{ github.event.inputs.enable_music }}
          ENABLE_SFX: ${{ github.event.inputs.enable_sfx }}
        run: |
          python main.py --check || echo "⚠ Some checks failed but continuing"

      - name: 🎬 Generate video
        id: generate
        env:
          # ═══════════════════════════════════════════════════════
          # 🤖 AI Keys
          # ═══════════════════════════════════════════════════════
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # ═══════════════════════════════════════════════════════
          # 🎙️ TTS Settings
          # ═══════════════════════════════════════════════════════
          TTS_ENGINE: ${{ github.event.inputs.tts_engine }}
          TTS_VOICE: ${{ github.event.inputs.voice }}
          
          # Gemini TTS
          GEMINI_VOICE: ${{ github.event.inputs.gemini_voice }}
          GEMINI_STYLE: ${{ github.event.inputs.content_type }}
          GEMINI_TEMPERATURE: "1.0"
          
          # ElevenLabs
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          
          # ═══════════════════════════════════════════════════════
          # 🎬 Media Sources
          # ═══════════════════════════════════════════════════════
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          
          # ═══════════════════════════════════════════════════════
          # ⚙️ Video Settings
          # ═══════════════════════════════════════════════════════
          VIDEO_WIDTH: "1080"
          VIDEO_HEIGHT: "1920"
          VIDEO_FPS: "30"
          VIDEO_TARGET_DURATION: ${{ github.event.inputs.duration }}
          VIDEO_QUALITY: ${{ github.event.inputs.quality }}
          
          # ═══════════════════════════════════════════════════════
          # 🆕 🎵 Music Settings
          # ═══════════════════════════════════════════════════════
          ENABLE_BACKGROUND_MUSIC: ${{ github.event.inputs.enable_music }}
          MUSIC_VOLUME: ${{ github.event.inputs.music_volume }}
          MUSIC_DOWNLOAD_TIMEOUT: "60"
          ENABLE_YOUTUBE_MUSIC: "false"
          
          # ═══════════════════════════════════════════════════════
          # 🆕 🔊 SFX Settings
          # ═══════════════════════════════════════════════════════
          ENABLE_SFX: ${{ github.event.inputs.enable_sfx }}
          SFX_VOLUME: ${{ github.event.inputs.sfx_volume }}
          MAX_SFX_PER_VIDEO: "5"
          SFX_DOWNLOAD_TIMEOUT: "30"
          
          # ═══════════════════════════════════════════════════════
          # 🎙️ Audio Optimizer Settings
          # ═══════════════════════════════════════════════════════
          AUDIO_SPEED: ${{ github.event.inputs.audio_speed }}
          REMOVE_SILENCE: ${{ github.event.inputs.remove_silence }}
          SPEED_UP_AUDIO: "true"
          NORMALIZE_AUDIO: "true"
          ENHANCE_AUDIO: "true"
          AUDIO_SAFE_MODE: "true"
          SILENCE_THRESHOLD_DB: "-35"
          MIN_SILENCE_DURATION: "0.4"
          KEEP_SILENCE_DURATION: "0.15"
          
          # ═══════════════════════════════════════════════════════
          # 🎚️ AudioFX Settings (Voice Processing)
          # ═══════════════════════════════════════════════════════
          LOUDNESS_PRESET: "youtube"
          VOICE_VOLUME: "1.0"
          VOICE_ECHO_ENABLED: "true"
          
          # ═══════════════════════════════════════════════════════
          # 📁 Paths
          # ═══════════════════════════════════════════════════════
          OUTPUT_DIR: ./output
          TEMP_DIR: ./temp
          MUSIC_DIR: ./engine/assets/music
          SFX_DIR: ./engine/assets/sfx
          
          # ═══════════════════════════════════════════════════════
          # 🎬 Remotion
          # ═══════════════════════════════════════════════════════
          REMOTION_DIR: ./remotion
          USE_REMOTION: "true"
          REMOTION_COMPOSITION: "ShortsVideo"
          
          # ═══════════════════════════════════════════════════════
          # 🎤 Whisper (Word-Level Subtitles)
          # ═══════════════════════════════════════════════════════
          USE_WHISPER: "true"
          WHISPER_MODEL: "small"
          WHISPER_MAX_WORDS: "4"
          WHISPER_MAX_DURATION: "2.5"
          
          # ═══════════════════════════════════════════════════════
          # 📝 Content
          # ═══════════════════════════════════════════════════════
          DEFAULT_TOPIC: ${{ github.event.inputs.topic }}
          CONTENT_TYPE: ${{ github.event.inputs.content_type }}
        run: |
          python main.py \
            --topic "${{ github.event.inputs.topic }}" \
            --type "${{ github.event.inputs.content_type }}" \
            --duration "${{ github.event.inputs.duration }}" \
            --quality "${{ github.event.inputs.quality }}"

      - name: 📊 Get video info
        id: video_info
        if: success()
        run: |
          VIDEO_FILE=$(ls output/*.mp4 2>/dev/null | head -n 1)
          if [ -z "$VIDEO_FILE" ]; then
            echo "❌ No video file found!"
            exit 1
          fi
          VIDEO_NAME=$(basename "$VIDEO_FILE")
          VIDEO_SIZE=$(du -h "$VIDEO_FILE" | cut -f1)
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "video_file=$VIDEO_FILE" >> $GITHUB_OUTPUT
          echo "video_name=$VIDEO_NAME" >> $GITHUB_OUTPUT
          echo "video_size=$VIDEO_SIZE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo ""
          echo "✅ Video generated:"
          echo "   📁 File: $VIDEO_FILE"
          echo "   📦 Size: $VIDEO_SIZE"

      - name: 📤 Upload as Artifact (backup)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.txt
          retention-days: 30

      - name: 🚀 Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}-${{ steps.video_info.outputs.timestamp }}
          name: 🎬 Short ${{ github.run_number }} - ${{ github.event.inputs.topic }}
          body: |
            ## 🎥 فيديو جديد تم إنشاؤه تلقائياً

            **📝 الموضوع:** ${{ github.event.inputs.topic }}
            **🎭 النوع:** ${{ github.event.inputs.content_type }}
            
            ### 🎙️ الصوت
            **محرك الصوت:** ${{ github.event.inputs.tts_engine }}
            **الصوت:** ${{ github.event.inputs.tts_engine == 'gemini' && github.event.inputs.gemini_voice || github.event.inputs.voice }}
            **سرعة الصوت:** ${{ github.event.inputs.audio_speed }}x
            **إزالة الفراغات:** ${{ github.event.inputs.remove_silence }}
            
            ### 🎵 الموسيقى والمؤثرات
            **الموسيقى:** ${{ github.event.inputs.enable_music == 'true' && '✓ مفعّلة' || '✗ معطّلة' }}
            **مستوى الموسيقى:** ${{ github.event.inputs.music_volume }}
            **المؤثرات الصوتية:** ${{ github.event.inputs.enable_sfx == 'true' && '✓ مفعّلة' || '✗ معطّلة' }}
            **مستوى المؤثرات:** ${{ github.event.inputs.sfx_volume }}
            
            ### ⚙️ الإعدادات التقنية
            **المدة:** ${{ github.event.inputs.duration }} ثانية
            **الجودة:** ${{ github.event.inputs.quality }}
            **الحجم:** ${{ steps.video_info.outputs.video_size }}

            ---
            🤖 **Pro Audio Edition v2.3**
            🎬 محرك التصدير: Remotion (دعم كامل للعربية)
            🎙️ محرك الصوت: ${{ github.event.inputs.tts_engine }}
            🎵 معالجة الصوت: AudioOptimizer + AudioFX
            🎤 الترجمات: Whisper (TikTok style word-by-word)
            📝 السكربت: Value-Driven Engine v4.0
            🎵 الموسيقى: Pixabay (مجانية للاستخدام)
            🔊 المؤثرات: SFXManager (smart per-scene)
            🔗 رقم التشغيل: #${{ github.run_number }}
            📅 التاريخ: ${{ steps.video_info.outputs.timestamp }}
          files: |
            output/*.mp4
            output/*.jpg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Workflow Summary
        if: always()
        run: |
          echo "## 🎬 ملخص التشغيل (Pro Audio Edition v2.3)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 المحتوى" >> $GITHUB_STEP_SUMMARY
          echo "| الخاصية | القيمة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 الموضوع | ${{ github.event.inputs.topic }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎭 النوع | ${{ github.event.inputs.content_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ المدة | ${{ github.event.inputs.duration }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| ✨ الجودة | ${{ github.event.inputs.quality }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎙️ الصوت" >> $GITHUB_STEP_SUMMARY
          echo "| الخاصية | القيمة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎙️ محرك الصوت | ${{ github.event.inputs.tts_engine }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎤 الصوت | ${{ github.event.inputs.tts_engine == 'gemini' && github.event.inputs.gemini_voice || github.event.inputs.voice }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ سرعة الصوت | ${{ github.event.inputs.audio_speed }}x |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔇 إزالة الفراغات | ${{ github.event.inputs.remove_silence }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎵 الموسيقى والمؤثرات" >> $GITHUB_STEP_SUMMARY
          echo "| الخاصية | القيمة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎵 الموسيقى | ${{ github.event.inputs.enable_music }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎵 مستوى الموسيقى | ${{ github.event.inputs.music_volume }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔊 المؤثرات | ${{ github.event.inputs.enable_sfx }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔊 مستوى المؤثرات | ${{ github.event.inputs.sfx_volume }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎬 التقنيات المستخدمة" >> $GITHUB_STEP_SUMMARY
          echo "| المكون | الإصدار |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🎬 Renderer | Remotion v4 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎤 Subtitles | Whisper (TikTok) |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 Script Engine | Value-Driven v4.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎵 Music | Pixabay (Free) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔊 SFX | SFXManager (Smart) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 النتيجة" >> $GITHUB_STEP_SUMMARY
          echo "| الخاصية | القيمة |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔢 رقم التشغيل | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ الحالة | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: 📋 Save logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_number }}
          path: |
            temp/
            remotion/out/
          retention-days: 7

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -rf temp/ || true
          rm -rf remotion/out/ || true
          echo "✅ تم التنظيف"
