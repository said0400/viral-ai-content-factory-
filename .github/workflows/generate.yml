name: Generate Viral Video

on:
  schedule:
    - cron: "0 8 * * *"      # كل يوم الساعة 8 صباحاً
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الفيديو"
        required: false
        default: "الطموح والنجاح"
      preset:
        description: "جودة الإخراج"
        required: false
        default: "tiktok"
        type: choice
        options: [tiktok, reels, preview]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Arabic fonts
        run: sudo apt-get install -y fonts-noto-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p output temp engine/assets/fonts engine/assets/music engine/assets/sfx

      - name: Generate video
        env:
          # ─── مطلوب فقط GROQ_API_KEY ──────────────────────────────────
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OUTPUT_DIR:     ./output
          TEMP_DIR:       ./temp
          VIDEO_WIDTH:    "1080"
          VIDEO_HEIGHT:   "1920"
          VIDEO_FPS:      "30"
          DEFAULT_TOPIC:  ${{ github.event.inputs.topic || 'الطموح والنجاح' }}
        run: |
          python main.py \
            --topic "${{ github.event.inputs.topic || 'الطموح والنجاح' }}" \
            --preset "${{ github.event.inputs.preset || 'tiktok' }}"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: viral-video-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7

      - name: Upload thumbnail
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: thumbnail-${{ github.run_number }}
          path: output/*.jpg
          retention-days: 7
