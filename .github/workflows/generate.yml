name: 🎬 Generate Arabic Shorts (Pro v3.0)

on:
  # ═══════════════════════════════════════════════════════════════
  # Manual trigger مع inputs
  # ═══════════════════════════════════════════════════════════════
  workflow_dispatch:
    inputs:
      topic:
        description: "📝 موضوع الفيديو"
        required: true
        default: "الطموح والنجاح"
        type: string
      
      content_type:
        description: "🎭 نوع المحتوى"
        required: true
        default: "motivational"
        type: choice
        options:
          - motivational
          - educational
          - story
          - quote
      
      tts_engine:
        description: "🎙️ محرك الصوت"
        required: true
        default: "edge"
        type: choice
        options:
          - auto
          - edge
          - groq
          - gemini
          - elevenlabs
      
      voice:
        description: "🎙️ صوت Edge TTS"
        required: false
        default: "ar-SA-HamedNeural"
        type: choice
        options:
          - ar-SA-HamedNeural
          - ar-SA-ZariyahNeural
          - ar-EG-ShakirNeural
          - ar-EG-SalmaNeural
          - ar-AE-HamdanNeural
          - ar-JO-TaimNeural
      
      gemini_voice:
        description: "🎤 صوت Gemini"
        required: false
        default: "Achird"
        type: choice
        options:
          - Achird
          - Algenib
          - Aoede
          - Charon
          - Kore
      
      audio_speed:
        description: "⚡ سرعة الصوت"
        required: false
        default: "1.1"
        type: choice
        options: ["1.0", "1.05", "1.1", "1.15", "1.2"]
      
      enable_music:
        description: "🎵 الموسيقى الخلفية"
        required: false
        default: "true"
        type: boolean
      
      music_volume:
        description: "🎵 مستوى الموسيقى"
        required: false
        default: "0.15"
        type: choice
        options: ["0.10", "0.15", "0.20", "0.25"]
      
      enable_sfx:
        description: "🔊 المؤثرات الصوتية"
        required: false
        default: "true"
        type: boolean
      
      duration:
        description: "⏱️ مدة الفيديو"
        required: true
        default: "45"
        type: choice
        options: ["30", "45", "60"]
      
      quality:
        description: "✨ جودة التصدير"
        required: true
        default: "high"
        type: choice
        options: [draft, medium, high, ultra]
      
      create_release:
        description: "📤 نشر كـ Release"
        required: false
        default: true
        type: boolean
  
  # ═══════════════════════════════════════════════════════════════
  # Schedule (تشغيل تلقائي - معطّل افتراضياً)
  # ═══════════════════════════════════════════════════════════════
  # schedule:
  #   - cron: '0 9 * * *'  # كل يوم 9 صباحاً UTC

# ═══════════════════════════════════════════════════════════════════
# Permissions
# ═══════════════════════════════════════════════════════════════════
permissions:
  contents: write

# ═══════════════════════════════════════════════════════════════════
# Concurrency (منع التشغيلات المتزامنة)
# ═══════════════════════════════════════════════════════════════════
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.topic }}
  cancel-in-progress: false

# ═══════════════════════════════════════════════════════════════════
# Environment Variables (مشتركة)
# ═══════════════════════════════════════════════════════════════════
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  CI: "true"

# ═══════════════════════════════════════════════════════════════════
# Jobs
# ═══════════════════════════════════════════════════════════════════
jobs:
  generate:
    name: 🚀 Generate Video
    runs-on: ubuntu-latest
    timeout-minutes: 90  # زيادة للجودة ultra
    
    # Environment variables للـ job
    env:
      # API Keys
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      
      # TTS Settings
      TTS_ENGINE: ${{ inputs.tts_engine || 'edge' }}
      TTS_VOICE: ${{ inputs.voice || 'ar-SA-HamedNeural' }}
      GEMINI_VOICE: ${{ inputs.gemini_voice || 'Achird' }}
      GEMINI_STYLE: ${{ inputs.content_type || 'motivational' }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      
      # Video Settings
      VIDEO_WIDTH: "1080"
      VIDEO_HEIGHT: "1920"
      VIDEO_FPS: "30"
      VIDEO_TARGET_DURATION: ${{ inputs.duration || '45' }}
      VIDEO_QUALITY: ${{ inputs.quality || 'high' }}
      
      # Audio Settings
      AUDIO_SPEED: ${{ inputs.audio_speed || '1.1' }}
      VOICE_VOLUME: "1.0"
      VOICE_ECHO_ENABLED: "true"
      LOUDNESS_PRESET: "youtube"
      
      # Music & SFX
      ENABLE_BACKGROUND_MUSIC: ${{ inputs.enable_music && 'true' || 'false' }}
      MUSIC_VOLUME: ${{ inputs.music_volume || '0.15' }}
      ENABLE_SFX: ${{ inputs.enable_sfx && 'true' || 'false' }}
      SFX_VOLUME: "0.35"
      MAX_SFX_PER_VIDEO: "5"
      
      # Whisper
      USE_WHISPER: "true"
      WHISPER_MODEL: "small"
      WHISPER_MAX_WORDS: "4"
      WHISPER_MAX_DURATION: "2.5"
      
      # Remotion (CI optimized)
      USE_REMOTION: "true"
      REMOTION_DIR: ./remotion
      REMOTION_COMPOSITION: "ShortsVideo"
      REMOTION_CONCURRENCY: "2"
      REMOTION_CRF: "23"
      REMOTION_LOG_LEVEL: "warn"
      REMOTION_HEADLESS: "true"
      REMOTION_CHROMIUM_PATH: /usr/bin/chromium-browser
      
      # Paths
      OUTPUT_DIR: ./output
      TEMP_DIR: ./temp
      MUSIC_DIR: ./engine/assets/music
      SFX_DIR: ./engine/assets/sfx
      
      # Content
      DEFAULT_TOPIC: ${{ inputs.topic }}
      CONTENT_TYPE: ${{ inputs.content_type }}
      
      # Logging
      LOG_LEVEL: "INFO"
      
      # Cache disabled in CI
      ENABLE_CACHING: "false"
    
    steps:
      # ═══════════════════════════════════════════════════════════
      # Setup
      # ═══════════════════════════════════════════════════════════
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: remotion/package-lock.json
      
      # ═══════════════════════════════════════════════════════════
      # System Dependencies
      # ═══════════════════════════════════════════════════════════
      - name: 🎞️ Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            chromium-browser \
            fonts-noto-core \
            fonts-noto-color-emoji \
            fontconfig \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64 \
            libxss1 \
            libxshmfence1 \
            libglu1-mesa
          
          # Verify
          ffmpeg -version | head -1
          chromium-browser --version
      
      # ═══════════════════════════════════════════════════════════
      # Python Dependencies (مع caching)
      # ═══════════════════════════════════════════════════════════
      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # ═══════════════════════════════════════════════════════════
      # Whisper Model Cache
      # ═══════════════════════════════════════════════════════════
      - name: 💾 Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1
          restore-keys: |
            whisper-
      
      # ═══════════════════════════════════════════════════════════
      # Remotion Dependencies (مع caching)
      # ═══════════════════════════════════════════════════════════
      - name: 🎬 Install Remotion Dependencies
        working-directory: ./remotion
        run: |
          if [ -f "package-lock.json" ]; then
            echo "✓ Using npm ci (deterministic)"
            npm ci --prefer-offline --no-audit
          else
            echo "⚠ No package-lock.json"
            npm install --no-audit
          fi
      
      - name: ✅ Verify Installation
        run: |
          echo "═══════════════════════════════════════════"
          echo "📦 Versions"
          echo "═══════════════════════════════════════════"
          python --version
          node --version
          npm --version
          ffmpeg -version | head -1
          echo ""
          echo "📦 Python packages:"
          pip list | grep -E "(groq|edge-tts|faster-whisper|google-genai)"
          echo ""
          echo "📦 Remotion:"
          ls -la remotion/node_modules/@remotion/ 2>/dev/null | head -5 || echo "⚠"
      
      # ═══════════════════════════════════════════════════════════
      # Project Setup
      # ═══════════════════════════════════════════════════════════
      - name: 🔤 Download Arabic Fonts
        run: |
          if [ -f "download_fonts.py" ]; then
            python download_fonts.py --no-loader || echo "⚠ Fonts download failed"
          else
            echo "ℹ Skipping fonts (using @remotion/google-fonts)"
          fi
      
      - name: 📁 Create Required Directories
        run: |
          mkdir -p output temp logs
          mkdir -p engine/assets/{fonts,music,sfx}
          mkdir -p remotion/public/{fonts,footage,audio}
          mkdir -p remotion/out
      
      # ═══════════════════════════════════════════════════════════
      # Pre-flight Check
      # ═══════════════════════════════════════════════════════════
      - name: 🔍 Pre-flight Check
        id: preflight
        run: |
          set +e
          python main.py --check
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::warning::Pre-flight check failed (exit: $EXIT_CODE)"
            echo "passed=false" >> $GITHUB_OUTPUT
          else
            echo "::notice::Pre-flight check passed"
            echo "passed=true" >> $GITHUB_OUTPUT
          fi
      
      # ═══════════════════════════════════════════════════════════
      # Generate Video
      # ═══════════════════════════════════════════════════════════
      - name: 🎬 Generate Video
        id: generate
        run: |
          python main.py \
            --topic "${{ inputs.topic }}" \
            --type "${{ inputs.content_type }}" \
            --duration "${{ inputs.duration }}" \
            --quality "${{ inputs.quality }}" \
            --tts-engine "${{ inputs.tts_engine }}" \
            --log-file logs/generation.log
      
      # ═══════════════════════════════════════════════════════════
      # Get Video Info
      # ═══════════════════════════════════════════════════════════
      - name: 📊 Get Video Info
        id: video_info
        if: success()
        run: |
          set -e
          
          # Find video
          VIDEO_FILE=$(find output -name "*.mp4" -type f | head -n 1)
          
          if [ -z "$VIDEO_FILE" ]; then
            echo "::error::No video file generated!"
            exit 1
          fi
          
          VIDEO_NAME=$(basename "$VIDEO_FILE")
          VIDEO_SIZE=$(du -h "$VIDEO_FILE" | cut -f1)
          VIDEO_SIZE_MB=$(du -m "$VIDEO_FILE" | cut -f1)
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          
          # Get duration
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$VIDEO_FILE" 2>/dev/null \
            | head -1 | awk '{printf "%.1f", $1}')
          
          # Output
          {
            echo "video_file=$VIDEO_FILE"
            echo "video_name=$VIDEO_NAME"
            echo "video_size=$VIDEO_SIZE"
            echo "video_size_mb=$VIDEO_SIZE_MB"
            echo "duration=$DURATION"
            echo "timestamp=$TIMESTAMP"
          } >> $GITHUB_OUTPUT
          
          echo "✅ Video generated:"
          echo "   📁 File: $VIDEO_NAME"
          echo "   📦 Size: $VIDEO_SIZE ($VIDEO_SIZE_MB MB)"
          echo "   ⏱  Duration: ${DURATION}s"
      
      # ═══════════════════════════════════════════════════════════
      # Upload Artifact
      # ═══════════════════════════════════════════════════════════
      - name: 📤 Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: shorts-${{ github.run_number }}-${{ steps.video_info.outputs.timestamp }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
            logs/*.log
          retention-days: 30
          if-no-files-found: error
      
      # ═══════════════════════════════════════════════════════════
      # Create Release (إذا مفعّل)
      # ═══════════════════════════════════════════════════════════
      - name: 🚀 Publish GitHub Release
        if: success() && (inputs.create_release == true || inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ github.run_number }}-${{ steps.video_info.outputs.timestamp }}
          name: "🎬 Short #${{ github.run_number }} - ${{ inputs.topic }}"
          body: |
            ## 🎥 فيديو جديد تم إنشاؤه تلقائياً
            
            ### 📝 المحتوى
            | الخاصية | القيمة |
            |---------|--------|
            | 📝 الموضوع | ${{ inputs.topic }} |
            | 🎭 النوع | ${{ inputs.content_type }} |
            | ⏱️ المدة | ${{ steps.video_info.outputs.duration }}s (target: ${{ inputs.duration }}s) |
            | ✨ الجودة | ${{ inputs.quality }} |
            | 📦 الحجم | ${{ steps.video_info.outputs.video_size }} |
            
            ### 🎙️ الصوت
            | الخاصية | القيمة |
            |---------|--------|
            | 🎙️ المحرك | ${{ inputs.tts_engine }} |
            | 🎤 الصوت | ${{ inputs.tts_engine == 'gemini' && inputs.gemini_voice || inputs.voice }} |
            | ⚡ السرعة | ${{ inputs.audio_speed }}x |
            
            ### 🎵 الموسيقى والمؤثرات
            | الخاصية | القيمة |
            |---------|--------|
            | 🎵 الموسيقى | ${{ inputs.enable_music && '✓ مفعّلة' || '✗ معطّلة' }} |
            | 🎵 مستوى الموسيقى | ${{ inputs.music_volume }} |
            | 🔊 المؤثرات | ${{ inputs.enable_sfx && '✓ مفعّلة' || '✗ معطّلة' }} |
            
            ---
            
            ### 🛠️ التقنيات
            - 🎬 **Renderer**: Remotion v4
            - 🎤 **Subtitles**: Whisper (Word-level)
            - 📝 **Script**: Value-Driven Engine v4.0
            - 🎵 **Music**: Local Library
            - 🔊 **SFX**: Smart per-scene
            
            ### 🔗 معلومات
            - **Run #**: ${{ github.run_number }}
            - **Workflow**: ${{ github.workflow }}
            - **Timestamp**: ${{ steps.video_info.outputs.timestamp }}
            - **Commit**: ${{ github.sha }}
          files: |
            output/*.mp4
            output/*.jpg
            output/*.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # ═══════════════════════════════════════════════════════════
      # Workflow Summary
      # ═══════════════════════════════════════════════════════════
      - name: 📋 Workflow Summary
        if: always()
        run: |
          {
            echo "# 🎬 Workflow Summary - Run #${{ github.run_number }}"
            echo ""
            echo "## 📝 المحتوى"
            echo "| الخاصية | القيمة |"
            echo "|---------|--------|"
            echo "| 📝 الموضوع | ${{ inputs.topic }} |"
            echo "| 🎭 النوع | ${{ inputs.content_type }} |"
            echo "| ⏱️ المدة | ${{ inputs.duration }}s |"
            echo "| ✨ الجودة | ${{ inputs.quality }} |"
            echo ""
            echo "## 🎙️ الصوت"
            echo "| الخاصية | القيمة |"
            echo "|---------|--------|"
            echo "| محرك TTS | ${{ inputs.tts_engine }} |"
            echo "| الصوت | ${{ inputs.tts_engine == 'gemini' && inputs.gemini_voice || inputs.voice }} |"
            echo "| سرعة الصوت | ${{ inputs.audio_speed }}x |"
            echo ""
            echo "## 🎵 الموسيقى والمؤثرات"
            echo "| الخاصية | القيمة |"
            echo "|---------|--------|"
            echo "| 🎵 الموسيقى | ${{ inputs.enable_music }} (${{ inputs.music_volume }}) |"
            echo "| 🔊 SFX | ${{ inputs.enable_sfx }} |"
            echo ""
            echo "## 📊 النتيجة"
            echo "| الخاصية | القيمة |"
            echo "|---------|--------|"
            echo "| ✅ الحالة | ${{ job.status }} |"
            echo "| 🔢 رقم التشغيل | #${{ github.run_number }} |"
            
            if [ "${{ steps.video_info.outputs.video_size }}" != "" ]; then
              echo "| 📦 حجم الفيديو | ${{ steps.video_info.outputs.video_size }} |"
              echo "| ⏱️ المدة الفعلية | ${{ steps.video_info.outputs.duration }}s |"
            fi
          } >> $GITHUB_STEP_SUMMARY
      
      # ═══════════════════════════════════════════════════════════
      # Save Logs on Failure
      # ═══════════════════════════════════════════════════════════
      - name: 📋 Save Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_number }}
          path: |
            logs/
            temp/
            remotion/out/
            output/
          retention-days: 7
          if-no-files-found: warn
      
      # ═══════════════════════════════════════════════════════════
      # Cleanup
      # ═══════════════════════════════════════════════════════════
      - name: 🧹 Cleanup
        if: always()
        continue-on-error: true
        run: |
          # Remove temp files
          if [ -d "temp" ]; then
            rm -rf temp/*
            echo "✓ Cleaned temp/"
          fi
          
          # Remove remotion temp
          if [ -d "remotion/out" ]; then
            rm -rf remotion/out/*
            echo "✓ Cleaned remotion/out/"
          fi
          
          # Remove copied assets in remotion/public
          if [ -d "remotion/public/footage" ]; then
            rm -rf remotion/public/footage/*
            echo "✓ Cleaned remotion/public/footage/"
          fi
          
          if [ -d "remotion/public/audio" ]; then
            rm -rf remotion/public/audio/*
            echo "✓ Cleaned remotion/public/audio/"
          fi
          
          echo "✅ Cleanup complete"
      
      # ═══════════════════════════════════════════════════════════
      # Notification on Failure (اختياري)
      # ═══════════════════════════════════════════════════════════
      - name: 🔔 Notify on Failure
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "::error::Video generation failed for topic: ${{ inputs.topic }}"
          # هنا يمكن إضافة integration مع Discord/Slack/Telegram
